<VirtualHost *:80>
    ServerName ggrna.dbcls.jp
    DocumentRoot /var/www/html
    SetEnv PERL5LIB /var/www/html
    Header append Access-Control-Allow-Origin "*"
    AllowEncodedSlashes On 

    RewriteEngine On

    # CSS/JS/image などは 302 させない
    RewriteRule ^/[A-Za-z]+/static/(.*)$ /static/$1 [L]
    RewriteRule ^/static/ - [L]

    DirectoryIndex index.pl index.cgi index.cgi.en index.html
    <Directory /var/www/html>
        Options ExecCGI FollowSymLinks
        AllowOverride All 
        Require all granted
        AddHandler cgi-script .cgi .pl
    </Directory>


    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
